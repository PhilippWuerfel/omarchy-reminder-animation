name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qml-tests:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install Qt
        run: pacman -Syu --noconfirm qt6-declarative
      - uses: actions/checkout@v4
      - name: Run QML tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: /usr/lib/qt6/bin/qmltestrunner -input tests
